name: northstar-server
services:
  terminal:
    build: .
    image: northstar-terminal:2026-10-03-server-ready
    init: true
    restart: unless-stopped
    env_file: .env.server
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NORTHSTAR_DB_PATH: /data/terminal.sqlite
      NORTHSTAR_RUNTIME_DIR: /data/runtime
    ports:
      - "127.0.0.1:${NORTHSTAR_HOST_PORT:-3000}:3000"
    volumes:
      - terminal-data:/data
      - terminal-backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  terminal-data:
  terminal-backups:
